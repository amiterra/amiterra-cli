[package]
name = "amiterra"
version = "0.1.0"
edition = "2024"
authors = ["Evgenii Myzgin <evmyzgin@gmail.com>", "Amiterra Architecture Team"]
description = "Universal Host OS Engine & Bootstrapper for Amiterra Private Cloud"
license-file = "LICENSE"
homepage = "https://amiterra.io"
repository = "https://github.com/amiterra/amiterra-cli"

[[bin]]
name = "amiterra"
path = "src/main.rs"

[dependencies]
# YAML serialization and parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# Async runtime and HTTP client for Kubelet API integration
tokio = { version = "1.53", features = ["full"] }

# Idiomatic error handling
anyhow = "1.0"

# Wildcard pattern matching for sysfs paths
glob = "0.3"

# Kubelet API integration
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0"

# Filesystem event notifications (inotify)
notify = "6.1"

# Structured logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# CLI Parsing
clap = { version = "4.6", features = ["derive"] }
