[package]
name = "amiterra"
version = "0.1.0"
edition = "2024"
authors = ["Evgenii Myzgin <evmyzgin@gmail.com>", "Amiterra Architecture Team"]
description = "Universal Host OS Engine & Bootstrapper for Amiterra Private Cloud"
license-file = "LICENSE"
homepage = "https://amiterra.io"
repository = "https://github.com/amiterra/amiterra-cli"

[[bin]]
name = "amiterra"
path = "src/main.rs"

[dependencies]
# YAML serialization and parsing
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml = "0.9.34"

# Async runtime and HTTP client for Kubelet API integration
tokio = { version = "1.54", features = ["full"] }

# Idiomatic error handling
anyhow = "1.0.104"

# Wildcard pattern matching for sysfs paths
glob = "0.3.4"

# Kubelet API integration
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde_json = "1.0.154"

# Filesystem event notifications (inotify)
notify = "8.2"

# Structured logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }

# CLI Parsing
clap = { version = "4.6.7", features = ["derive"] }

# GitOps bootstrap: ed25519 OpenSSH deploy keys + content checksums
ssh-key = { version = "0.6.7", features = ["ed25519", "getrandom"] }
sha2 = "0.11"
base64 = "0.23"
tempfile = "3.27"
